version: '3.8'

services:
  jabuti-postgres:
    image: postgres:16-alpine
    container_name: jabuti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jabuti_sql
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - jabuti_pgdata:/var/lib/postgresql/data
    networks:
      - spider-net

volumes:
  jabuti_pgdata:
    name: jabuti_pgdata

networks:
  spider-net:
    name: spider-net
